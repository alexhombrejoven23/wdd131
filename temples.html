<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive temple photo album with beautiful temple images from around the world">
    <title>Temple Album | Sacred Places</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fas fa-place-of-worship"></i> Temple Album</h1>
            <button class="hamburger" aria-label="Toggle navigation menu">
                <i class="fas fa-bars"></i>
                <i class="fas fa-times"></i>
            </button>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">Old</a></li>
                    <li><a href="#">New</a></li>
                    <li><a href="#">Large</a></li>
                    <li><a href="#">Small</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="temples ">
            <h2><i class="fas fa-camera"></i> Sacred Temple Photography</h2>
            <p>Explore beautiful temples from around the world</p>
        </div>

        <div class="gallery">
            <figure>
                <img src="./images/argentina.jpg" 
                     alt="argentina" loading="lazy">
                <figcaption>Argentina</figcaption>
            </figure>
            
            <figure>
                <img src="./images/bogota.jpg" 
                     alt="colombia" loading="lazy">
                <figcaption>Colombia</figcaption>
            </figure>
            
            <figure>
                <img src="./images/honduras.jpg" 
                     alt="Honduras" loading="lazy">
                <figcaption>Honduras</figcaption>
            </figure>
            
            <figure>
                <img src="./images/saltlake.jpg"
                     alt="Salt Lake temple" loading="lazy">
                <figcaption>Salt Lake Temple, USA</figcaption>
            </figure>
            
            <figure>
                <img src="./images/thailand.jpg" 
                     alt="thailand" loading="lazy">
                <figcaption> Thailand</figcaption>
            </figure>
            
            <figure>
                <img src="./images/turkey.jpg" 
                     alt="turkey" loading="lazy">
                <figcaption>Turkey</figcaption>
            </figure>
            
            <figure>
                <img src="./images/indoneisa.jpg" 
                     alt=" Temple in Indonesia" loading="lazy">
                <figcaption>Indonesia</figcaption>
            </figure>
            
            <figure>
                <img src="./images/brazil.jpg" 
                     alt="brazil" loading="lazy">
                <figcaption>Brazil</figcaption>
            </figure>
            
            <figure>
                <img src="./images/spain.jpg" 
                     alt="Madrid" loading="lazy">
                <figcaption>Spain</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; <span id="currentYear"></span> Temple Album | <span id="studentName">Alex Condori</span></p>
            <p><i class="fas fa-map-marker-alt"></i> United States</p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>
</html>
